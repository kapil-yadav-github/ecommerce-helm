apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-service
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: nginx

  rules:
    - host: {{ .Values.ingress.host }}

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: order-service
                port:
                  number: {{ .Values.service.port }}